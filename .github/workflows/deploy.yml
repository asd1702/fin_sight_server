name: CI/CD Pipeline for FinSight Server

on:
  push:
    branches:
      - main
    paths-ignore:
      - 'docs/**'
      - 'README.md'

jobs:
  build-and-push:
    name: Build and Push Docker Image
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build and push Docker Image
        uses: docker/build-push-action@v5
        with:
          context: .
          push: true
          tags: |
            asd1702/fin-sight-server:latest
            asd1702/fin-sight-server:prod-${{ github.sha }}
  
  deploy:
    name: Deploy to EC2
    needs: build-and-push
    runs-on: ubuntu-latest

    steps:
      - name: SSH and deploy
        uses: appleboy/ssh-action@master
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ${{ secrets.EC2_USER }}
          key: ${{ secrets.EC2_SSH_KEY }}
          script: |
            docker rm -f finsight-server || true
            docker pull asd1702/fin-sight-server:prod-${{ github.sha}}
            cd opt/finsight

            docker run -d --name finsight-server \
            -p 8000:8000 \
            --restart unless-stopped \
            --env-file prod.env \
            -e LOG_LEVEL=INFO \
            -e QUIET=1 \
            -e LOG_TO_FILE=0 \
            -e  UNSAFE_ADMIN_MODE=1 \
            asd1702/fin-sight-server:prod-${{ github.sha }}

            echo "Deployment completed successfully."
            
             