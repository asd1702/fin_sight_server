services:
  app:
    # Override: 운영 환경에서 외부 RDS(관리형 DB)를 사용하도록 환경 변수를 재정의합니다.
    # 로컬 개발 환경에서는 `docker-compose.prod.yml` 또는 기본 compose 파일의 `db` 서비스를
    # 사용하지만, 운영(프로덕션)에서는 관리형 RDS를 사용하기 때문에 이 파일을 통해
    # DATABASE_URL을 외부 DB로 포인트하도록 구성합니다.
    environment:
      # Provide these via an external, uncommitted secrets file or CI/CD
      # RDS_DB_USER, RDS_DB_PASSWORD, RDS_DB_HOST, RDS_DB_NAME can be set in a secrets.env (ignored) then: docker compose --env-file secrets.env ...
      RDS_DB_USER: ${RDS_DB_USER:-postgres}
      RDS_DB_PASSWORD: ${RDS_DB_PASSWORD:-change_me}
      RDS_DB_HOST: ${RDS_DB_HOST:-fin-sight-db.cdwkgswgkayp.ap-northeast-2.rds.amazonaws.com}
      RDS_DB_NAME: ${RDS_DB_NAME:-postgres}
      # DATABASE_URL assembled inline from the vars above
      DATABASE_URL: postgresql://${RDS_DB_USER}:${RDS_DB_PASSWORD}@${RDS_DB_HOST}:5432/${RDS_DB_NAME}
      # If your RDS forces SSL, append ?sslmode=require (uncomment next line and comment previous)
      # DATABASE_URL: postgresql://${RDS_DB_USER}:${RDS_DB_PASSWORD}@${RDS_DB_HOST}:5432/${RDS_DB_NAME}?sslmode=require
