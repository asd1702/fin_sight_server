version: '3.8'

services:
  # FinSight 애플리케이션
  app:
    build:
      context: .
      dockerfile: Dockerfile
    ports:
      - "8000:8000"
    depends_on:
      - db
    environment:
      - DATABASE_URL=postgresql://finsight_user:finsight_password@db:5432/finsight_db
      - OPENAI_API_KEY=${OPENAI_API_KEY}
      - NAVER_CLIENT_ID=${NAVER_CLIENT_ID}
      - NAVER_CLIENT_SECRET=${NAVER_CLIENT_SECRET}
      - ECOS_API_KEY=${ECOS_API_KEY}
      - DEBUG=False
      - LOG_LEVEL=INFO
    volumes:
      - ./logs:/app/logs
    # docker-entrypoint.sh 가 실행 가능해야 함 (git 권한 유지 또는 chmod +x)
    networks:
      - finsight-network
    restart: unless-stopped

  # PostgreSQL 데이터베이스
  db:
    image: postgres:15
    environment:
      - POSTGRES_DB=finsight_db
      - POSTGRES_USER=finsight_user
      - POSTGRES_PASSWORD=finsight_password
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    networks:
      - finsight-network
    restart: unless-stopped

  # Prometheus (모니터링)
  prometheus:
    image: prom/prometheus:latest
    container_name: prometheus
    volumes:
      - ./prometheus.yml:/etc/prometheus/prometheus.yml
    ports:
      - "9090:9090"
    networks:
      - finsight-network
    restart: unless-stopped

  # Grafana (시각화)
  grafana:
    image: grafana/grafana-oss:latest
    container_name: grafana
    ports:
      - "3000:3000"
    depends_on:
      - prometheus
    networks:
      - finsight-network
    restart: unless-stopped

volumes:
  postgres_data:

networks:
  finsight-network:
    driver: bridge
