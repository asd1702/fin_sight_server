######## Production compose file (quiet defaults). Monitoring services moved under 'monitoring' profile.


services:
  # FinSight 애플리케이션
  app:
    build:
      context: .
      dockerfile: Dockerfile
    ports:
      - "8000:8000"
    depends_on:
      - db
    env_file:
      - .env.prod
    environment:
      # docker-compose에서 생성한 db 컨테이너를 사용하도록 DATABASE_URL을 오버라이드합니다.
      - DATABASE_URL=postgresql://finsight_user:finsight_password@db:5432/finsight_db
      # QUIET 모드가 켜져 있으면 uvicorn access log 억제 및 warning 레벨
      - QUIET=${QUIET:-1}
    # Removed bind mount for logs to avoid permission issues; logs go to stdout (and file internally if permitted)
    # docker-entrypoint.sh 가 실행 가능해야 함 (git 권한 유지 또는 chmod +x)
    networks:
      - finsight-network
    restart: unless-stopped
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

  # PostgreSQL 데이터베이스
  db:
    image: postgres:15
    environment:
      - POSTGRES_DB=finsight_db
      - POSTGRES_USER=finsight_user
      - POSTGRES_PASSWORD=finsight_password
    volumes:
      - postgres_data:/var/lib/postgresql/data
    # No host port binding; container is reachable as 'db:5432' within the Docker network
    networks:
      - finsight-network
    restart: unless-stopped

  # Prometheus (모니터링)
  prometheus:
    profiles: ["monitoring"]
    image: prom/prometheus:latest
    container_name: prometheus
    volumes:
      - ./prometheus.yml:/etc/prometheus/prometheus.yml
    command:
      - --config.file=/etc/prometheus/prometheus.yml
      - --log.level=warn
      - --storage.tsdb.retention.time=15d
    ports:
      - "9090:9090"
    networks:
      - finsight-network
    restart: unless-stopped
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "2"

  # Grafana (시각화)
  grafana:
    profiles: ["monitoring"]
    image: grafana/grafana-oss:latest
    container_name: grafana
    ports:
      - "3001:3001"
    depends_on:
      - prometheus
    networks:
      - finsight-network
    restart: unless-stopped
    logging:
      driver: "json-file"
      options:
        max-size: "5m"
        max-file: "2"

volumes:
  postgres_data:

networks:
  finsight-network:
    driver: bridge
