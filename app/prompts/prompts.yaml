        =============== 사람 개념 구조 ===============
        1. 이번주 산업 핵심 & 주요 뉴스
           - 제목
           - (시각화 제안: CAPEX 추이 / 주요 업체 주가 상대 / 수요지표)
           - 내용(주간 톤: 수요/공급/가격/발표 중심)
           - (다음 6개 카테고리 중 이번주 가장 영향 큰 선택 주제 1개 표시)
             1) 수요 트렌드 (AI 워크로드, 데이터센터, 엔터프라이즈 IT)
             2) 공급망 & 제조 (공정, 용량, 리드타임, 병목)
