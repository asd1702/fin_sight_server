        6) summary: 수요 → 공급 → 기술/정책 → 경쟁/투자 → 전망 흐름.
        7) citations: 6~10개 (플레이어/공정/정책 다변화 반영). 제목은 한국어 요약.
        8) 과장/마케팅 표현 억제, 근거 불명확 시 "재확인 필요".
        9) 숫자: 성장률%, CAPEX $, 리드타임(주), 점유율p 등 최소 3개.

